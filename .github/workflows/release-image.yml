name: Release Image

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
    #   deploy:
    #     description: 'Deploy to dev environment'
    #     required: true
    #     type: boolean
    #     default: false
      tag:
        description: 'The tag to release'
        required: true
  push:
    branches: [ release-ci ]
  pull_request:
    types: [ closed ]
    branches: [ release-ci ]


env:
  ODIGLET_CONTAINER_NAME: apo-odigos-odiglet
  INSTRUMENTOR_CONTAINER_NAME: apo-odigos-instrumentor
  REGISTRY_HOST: registry.cn-hangzhou.aliyuncs.com
  REGISTRY_USERNAME_ARM: originx


jobs:
  build-images:
    strategy:
      matrix:
        os: [ ubuntu-latest ]
        include:
        - os: ubuntu-latest
          arch: amd64
        # - os: ubuntu-24.04-arm
        #   arch: arm64
    runs-on: ${{ matrix.os }}
    outputs:
      IMAGE_TAG_NAME: ${{ steps.build-image.outputs.IMAGE_TAG_NAME }}
    steps:
    - name: Echo only (non-manual triggers)
      if: github.event_name != 'workflow_dispatch'
      run: |
        echo "This workflow was triggered by '${{ github.event_name }}'; skipping actual build."

    - name: Checkout repository
      if: github.event_name == 'workflow_dispatch'
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Set up QEMU
      if: github.event_name == 'workflow_dispatch'
      uses: docker/setup-qemu-action@4574d27a4764455b42196d70a065bc6853246a25

    - name: Set up Docker Buildx
      if: github.event_name == 'workflow_dispatch'
      uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca

    - name: Log in to container registry
      if: github.event_name == 'workflow_dispatch'
      uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
      with:
        registry: ${{ env.REGISTRY_HOST }}
        username: ${{ secrets.REGISTRY_USERNAME }}
        password: ${{ secrets.REGISTRY_PASSWORD }}

    - name: Generate image metadata
      if: github.event_name == 'workflow_dispatch'
      id: build-image
      env:
        BRANCH_NAME: ${{ github.ref_name }}
        COMMIT_HASH: ${{ github.sha }}
      run: |
        echo "IMAGE_TAG_NAME=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
        echo "ODIGLET_IMAGE_FULL_TAG_AMD64=${{ env.REGISTRY_HOST }}/${{ secrets.REGISTRY_USERNAME }}/${{ env.ODIGLET_CONTAINER_NAME }}:${{ github.event.inputs.tag }}" >> $GITHUB_ENV
        echo "ODIGLET_IMAGE_FULL_TAG_ARM64=${{ env.REGISTRY_HOST }}/${{ secrets.REGISTRY_USERNAME }}/${{ env.ODIGLET_CONTAINER_NAME }}:${{ github.event.inputs.tag }}-arm64" >> $GITHUB_ENV
        echo "INSTRUMENTOR_IMAGE_FULL_TAG_AMD64=${{ env.REGISTRY_HOST }}/${{ secrets.REGISTRY_USERNAME }}/${{ env.INSTRUMENTOR_CONTAINER_NAME }}:${{ github.event.inputs.tag }}" >> $GITHUB_ENV
        echo "INSTRUMENTOR_IMAGE_FULL_TAG_ARM64=${{ env.REGISTRY_HOST }}/${{ secrets.REGISTRY_USERNAME }}/${{ env.INSTRUMENTOR_CONTAINER_NAME }}:${{ github.event.inputs.tag }}-arm64" >> $GITHUB_ENV

    - name: Build instrumentor docker image and push (AMD64)
      if: matrix.arch == 'amd64' && github.event_name == 'workflow_dispatch'
      run: |
        make build-instrumentor TAG=${{ github.event.inputs.tag }} ORG=${{ env.REGISTRY_HOST }}/${{ secrets.REGISTRY_USERNAME }}
        docker push ${{ env.INSTRUMENTOR_IMAGE_FULL_TAG_AMD64 }}

    - name: Build odiglet docker image and push (AMD64)
      if: matrix.arch == 'amd64' && github.event_name == 'workflow_dispatch'
      run: |
        tar -zvxf nodejs-instrumentation.tar.gz
        tar -zvxf tracer-home.tar
        make build-odiglet BUILD_ARGS="-f odiglet/Dockerfile" TAG=${{ github.event.inputs.tag }} ORG=${{ env.REGISTRY_HOST }}/${{ secrets.REGISTRY_USERNAME }}
        docker push ${{ env.ODIGLET_IMAGE_FULL_TAG_AMD64 }}

    - name: Build & push instrumentor (arm64)
      if: github.event_name == 'workflow_dispatch'
      run: |
        make push-instrumentor-arm64 TAG=${{ github.event.inputs.tag }} \
                                     ORG=${{ env.REGISTRY_HOST }}/${{ env.REGISTRY_USERNAME_ARM }}

    - name: Build & push odiglet (arm64)
      if: github.event_name == 'workflow_dispatch'
      run: |
        tar -zvxf nodejs-instrumentation.tar.gz
        tar -zvxf tracer-home.tar
        make push-odiglet-arm64 TAG=${{ github.event.inputs.tag }} \
                                 ORG=${{ env.REGISTRY_HOST }}/${{ env.REGISTRY_USERNAME_ARM }}

    - name: push tag
      if: github.event_name == 'workflow_dispatch'
      uses: anothrNick/github-tag-action@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        CUSTOM_TAG: ${{ github.event.inputs.tag }}
